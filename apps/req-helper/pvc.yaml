# Requirement Helper PersistentVolumeClaim
# Stores SQLite database files.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: req-helper-data
  namespace: apps
  labels:
    app: req-helper
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
