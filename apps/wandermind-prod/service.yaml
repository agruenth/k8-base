# Wandermind-Prod ClusterIP Service
---
apiVersion: v1
kind: Service
metadata:
  name: wandermind-prod
  namespace: apps
  labels:
    app: wandermind-prod
    env: prod
spec:
  type: ClusterIP
  selector:
    app: wandermind-prod
    env: prod
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
