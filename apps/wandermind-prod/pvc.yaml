# Wandermind-Prod PersistentVolumeClaim
# Stores SQLite database files.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wandermind-prod-data
  namespace: apps
  labels:
    app: wandermind-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
