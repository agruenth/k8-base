# Checkmate PersistentVolumeClaim
# Stores SQLite database files.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkmate-data
  namespace: apps
  labels:
    app: checkmate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
