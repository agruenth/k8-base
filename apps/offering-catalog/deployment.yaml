---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offering-catalog
  namespace: apps
  labels:
    app: offering-catalog
    env: exp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: offering-catalog
      env: exp
  template:
    metadata:
      labels:
        app: offering-catalog
        env: exp
    spec:
      containers:
        - name: offering-catalog
          image: registry.localhost:5000/offering-catalog:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3027
          env:
            - name: APP_NAME
              value: "offering-catalog"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: DATA_DIR
              value: "/data"
            - name: SYNC_INTERVAL_MS
              value: "300000"
            - name: OFFERINGS_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: offering-catalog-secrets
                  key: repo-url
                  optional: true
            - name: OFFERINGS_REPO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: offering-catalog-secrets
                  key: repo-token
                  optional: true
          resources:
            requests:
              memory: "160Mi"
              cpu: "50m"
            limits:
              memory: "320Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              port: 3027
              path: /exp/offering-catalog
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: 3027
              path: /exp/offering-catalog
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: offering-catalog-data
