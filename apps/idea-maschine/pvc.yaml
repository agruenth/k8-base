# Idea Maschine PersistentVolumeClaim
# Stores SQLite database files.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: idea-maschine-data
  namespace: apps
  labels:
    app: idea-maschine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
