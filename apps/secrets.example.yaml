---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: apps
  labels:
    app.kubernetes.io/part-of: workloads
type: Opaque
stringData:
  # Used by: wandermind, master-agent
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"

  # Used by: wandermind, master-agent, ai-tooling
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"

  # Used by: wandermind, master-agent
  ANTHROPIC_API_KEY: "REPLACE_WITH_ANTHROPIC_API_KEY"

  # Generic shared secret for inter-service auth
  INTERNAL_API_SECRET: "REPLACE_WITH_INTERNAL_SECRET"
